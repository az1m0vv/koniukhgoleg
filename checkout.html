<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop - Магазин гаджетів</title>
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header checkout-header">
    <div class="logo">TechShop</div>
  </header>

    <main class="checkout-main">
        <h1>Оформлення замовлення</h1>
        <a class="back-link" href="index.html">← Повернутися назад</a>
        <form action="#" method="POST" class="checkout-form">
            <fieldset>
                <legend>1. Особисті дані</legend>
                <div class="form-group">
                  <label for="fullName">ПІБ:</label>
                  <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    placeholder="Іванов Іван Іванович"
                  />
                </div>
                <div class="form-group">
                  <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required />
                </div>
                <div class="form-group">
                  <label for="phone">Телефон:</label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    pattern="\+380\d{9}"
                    placeholder="+380991234567"
                    required
                    title="Формат: +380XXXXXXXXX"
                  />
                </div>
              </fieldset>
              <fieldset>
                <legend>2. Спосіб доставки</legend>
                <div class="form-radio">
                  <input
                    type="radio"
                    id="deliveryNova"
                    name="delivery"
                    value="nova_poshta"
                    checked
                  />
                  <label for="deliveryNova">Нова Пошта</label>
                </div>
                <div class="form-radio">
                  <input
                    type="radio"
                    id="deliveryCourier"
                    name="delivery"
                    value="courier"
                  />
                  <label for="deliveryCourier">Кур'єр за адресою</label>
                </div>
              
                <div class="form-group">
                  <label for="city">Місто:</label>
                  <select id="city" name="city">
                    <option value="kyiv">Київ</option>
                    <option value="lviv">Львів</option>
                    <option value="odesa">Одеса</option>
                  </select>
                </div>
              </fieldset>
              <fieldset>
                <legend>3. Коментар та згода</legend>
                <div class="form-group">
                    <label for="comment">Коментар до замовлення:</label>
                    <textarea id="comment" name="comment" rows="4" minlength="10"
                              placeholder="Наприклад: зателефонуйте перед доставкою"></textarea>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">Я погоджуюсь з правилами магазину</label>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2025 TechShop. Всі права захищені.</p>
        <form class="form">
            <label for="email">Підпишіться на знижки:</label>
            <input type="email" id="contact-email" placeholder="123123@email.com">
            <button type="submit">Підписатися</button>
        </form>
    </footer>

</body>
</html>
