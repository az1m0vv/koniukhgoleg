<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop - Магазин гаджетів</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">TechShop</div>

        <nav class="main-nav">
            <ul class="menu">
                <li><a href="index.html">Головна</a></li>
                <li><a href="#">Товари</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn-cart">Кошик (0)</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Новинки 2025</h2>
            <a href="#" class="btn">Дивитися каталог</a>
        </section>

        <section class="catalog">
            <h2>Популярні товари</h2>

            <div class="products-grid">
                <article class="product-card">
                    <span class="badge">TOP</span>
                    <img src="assets/images/iphone-17.png" alt="Product Name" class="product-img">
                    <h3 class="product-title">iPhone 17 Pro Max</h3>
                    <p class="product-desc">Смартфон Apple iPhone 17 Pro Max 256Gb Cosmic Orange</p>
                    <span class="product-price">Ціна: 69 999 грн</span>
                    <button class="btn-buy">Купити</button>
                </article>
            </div>
            </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 TechShop. Всі права захищені.</p>
        <form class="form">
            <label for="email">Підпишіться на знижки:</label>
            <input type="email" id="email" placeholder="123123@email.com">
            <button type="submit">Підписатися</button>
        </form>
    </footer>

</body>
</html>
